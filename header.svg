<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="auto">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Neon Cyan gradient for lines and nodes -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
    
    <!-- Accent gradient for primary brand text -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing filter for network nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" />
  
  <!-- Subtle Background Grid/Tech Lines -->
  <path d="M 0 40 L 850 40 M 0 220 L 850 220" stroke="#1e293b" stroke-width="1" />
  <path d="M 500 0 L 500 260 M 350 0 L 350 260" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="5 5" />
  
  <!-- Decorative glowing code nodes (representing networking switch ports and links) -->
  <!-- Left group: server/network mesh -->
  <g transform="translate(60, 130)">
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="60" y2="-40" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" filter="url(#subtle-glow)" />
    <line x1="0" y1="0" x2="60" y2="40" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="2 3" />
    <line x1="60" y1="-40" x2="120" y2="-40" stroke="#818cf8" stroke-width="1.5" opacity="0.6" />
    <line x1="60" y1="40" x2="120" y2="40" stroke="#818cf8" stroke-width="1.5" opacity="0.6" />
    <line x1="120" y1="-40" x2="180" y2="0" stroke="#c084fc" stroke-width="1.5" opacity="0.6" />
    <line x1="120" y1="40" x2="180" y2="0" stroke="#c084fc" stroke-width="1.5" opacity="0.6" filter="url(#subtle-glow)" />
    <line x1="0" y1="0" x2="180" y2="0" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
    
    <!-- Nodes -->
    <circle cx="0" cy="0" r="6" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="60" cy="-40" r="5" fill="#38bdf8" />
    <circle cx="60" cy="40" r="5" fill="#38bdf8" />
    <circle cx="120" cy="-40" r="5" fill="#818cf8" />
    <circle cx="120" cy="40" r="5" fill="#818cf8" />
    <circle cx="180" cy="0" r="6" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Right group: terminal emulator block (looks incredibly high-tech) -->
  <g transform="translate(540, 50)">
    <!-- Terminal window body -->
    <rect width="260" height="160" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1.5" />
    <!-- Header bar -->
    <path d="M 0 8 Q 0 0 8 0 L 252 0 Q 260 0 260 8 L 260 25 L 0 25 Z" fill="#0f172a" stroke="#1e293b" stroke-width="0.5" />
    <!-- Window buttons -->
    <circle cx="15" cy="12" r="4" fill="#ef4444" />
    <circle cx="27" cy="12" r="4" fill="#eab308" />
    <circle cx="39" cy="12" r="4" fill="#22c55e" />
    <text x="250" y="15" fill="#475569" font-family="monospace" font-size="10" text-anchor="end">bash</text>
    
    <!-- Console prompt text -->
    <text x="15" y="45" fill="#38bdf8" font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="11">turing@node-srv:~$ <tspan fill="#f1f5f9">./tunnel_init</tspan></text>
    
    <text x="15" y="65" fill="#22c55e" font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="10">⚡ CLOUDFLARE TUNNEL [UP]</text>
    
    <text x="15" y="85" fill="#e2e8f0" font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="10">⚙️  OLLAMA ENVIRONMENT [OK]</text>
    <text x="35" y="100" fill="#94a3b8" font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="9">> Llama3.1 : 8B Active (Local)</text>
    
    <text x="15" y="125" fill="#f59e0b" font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="10">⚠️  IDS: 0 Active Threats</text>
    
    <!-- Glowing green cursor -->
    <rect x="15" y="138" width="8" height="12" fill="#22c55e" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite" />
    </rect>
    <text x="28" y="148" fill="#22c55e" font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="10">SYSTEM_ONLINE_</text>
  </g>

  <!-- Center-Left Text Section -->
  <g transform="translate(240, 130)">
    <!-- Main Headline with Gradient -->
    <text x="0" y="-10" fill="url(#accent-grad)" font-family="'Segoe UI', Inter, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">NETWORKS &amp; SYSTEMS</text>
    <text x="0" y="18" fill="#ffffff" font-family="'Segoe UI', Inter, sans-serif" font-weight="700" font-size="16" letter-spacing="3">ENGINEERING ARCHITECT</text>
    
    <!-- Subtitle representing keys -->
    <text x="0" y="48" fill="#94a3b8" font-family="'Segoe UI', Inter, sans-serif" font-weight="500" font-size="11" letter-spacing="0.5">
      Infrastructure Hardening <tspan fill="#38bdf8">•</tspan> Virtualization <tspan fill="#38bdf8">•</tspan> Automated AI Integration
    </text>
  </g>

  <!-- Cisco-style ethernet port aesthetic elements at the bottom right as decorative shapes -->
  <g transform="translate(20, 230)" fill="#1e293b" opacity="0.6">
    <rect x="0" y="0" width="12" height="10" rx="1" />
    <rect x="16" y="0" width="12" height="10" rx="1" />
    <rect x="32" y="0" width="12" height="10" rx="1" stroke="#38bdf8" stroke-width="1" fill="#0f172a" />
    <circle cx="38" cy="5" r="2" fill="#22c55e" />
    <rect x="48" y="0" width="12" height="10" rx="1" />
    <text x="70" y="9" fill="#475569" font-family="sans-serif" font-size="9">PORT STATUS: ACTIVE</text>
  </g>
</svg>
